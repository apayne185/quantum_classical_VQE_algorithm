name: hybrid-vqe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pybind11
  - cmake
  - numpy
  - scipy
  - matplotlib
  - mpi4py
  - mpich
  # Pin UCX <1.20 - 1.20.0 ships with libuct referencing an unexported
  # ucs_netif_is_ipoib symbol, breaking the mpi4py import chain.
  - ucx<1.20
  - gcc_linux-64
  - gxx_linux-64
  - pip
  - pip:
      - qiskit>=1.0,<2.0
      - qiskit-aer>=0.14.0
      - qiskit-aer-gpu; platform_system == "Linux"
      - qiskit-algorithms>=0.3.0
      - qiskit-nature>=0.7
      - qiskit-ibm-runtime>=0.20
      - pyscf>=2.4
      - pylatexenc
      - cupy-cuda12x; platform_system == "Linux"
      - rdkit
